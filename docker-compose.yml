version: '3.8'

services:
  # The PostGIS Database Service
  db:
    image: postgis/postgis:15-3.4
    container_name: sports-db
    environment:
      - POSTGRES_DB=sportsapp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password # Matches db.password in your secrets file
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Your Spring Boot App Service
  app:
    build: .
    container_name: sports-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db  # This is the only one you strictly need here
    depends_on:
      - db

volumes:
  postgres_data:
