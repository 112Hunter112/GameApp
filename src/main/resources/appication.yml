spring:
  config:
    import: "classpath:application-secrets.properties"
  application:
    name: sports-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/sportsapp
    username: postgres
    password: ${db.PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${jwt.SECRET}
  expiration: ${jwt.EXPIRATION}
---

## **What was wrong:**

1. **`...`** (three dots) is not valid YAML syntax - remove them
2. **Weird characters** like `***` in your comments - remove those
3. **Comments should use `#`** not `**`

---

## **How to fix:**

1. **Select ALL text** in `application.yml` (Ctrl+A)
2. **Delete it**
3. **Copy and paste** the corrected version above
4. **Save** (Ctrl+S)

---

After fixing, the errors at the bottom should disappear. Then try running `SportsBackendApplication` again - you should see:
  ```
Tomcat started on port(s): 8080
  
  
  | Method | Purpose | When Used |
  |--------|---------|-----------|
  | `generateToken(email)` | Create new JWT | After successful login/register |
  | `createToken(claims, subject)` | Build JWT with signature | Called by generateToken |
  | `getSigningKey()` | Convert secret to Key object | Internal helper |
  | `extractEmail(token)` | Get email from token | When validating requests |
  | `extractExpiration(token)` | Get expiration date | Check if expired |
  | `extractClaim(token, resolver)` | Get any claim | Generic extraction |
  | `extractAllClaims(token)` | Decode entire token | Internal helper |
  | `isTokenExpired(token)` | Check if expired | Validation |
  | `validateToken(token, email)` | Full validation | Every authenticated request |


