spring:
  config:
    import: optional:classpath:application-secrets.properties
  application:
    name: sports-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sportsapp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        # --- THIS IS THE FIX ---
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    # Never leak stack traces or internal exception messages to clients.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# CORS: comma-separated explicit origins. NEVER use "*" in production.
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Google Sign-In: comma-separated client IDs that we accept ID tokens for.
# Get these from Google Cloud Console -> Credentials -> OAuth 2.0 Client IDs.
# Typically: one Android client ID, one iOS client ID, one web client ID.
google:
  oauth:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
