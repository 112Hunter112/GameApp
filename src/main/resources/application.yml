spring:
  config:
    import: optional:classpath:application-secrets.properties
  application:
    name: sports-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/sportsapp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        # --- THIS IS THE FIX ---
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

jwt:
  secret: ${jwt.secret}
  expiration: 86400000
