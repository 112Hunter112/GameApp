# Production docker-compose override for Sportsman backend.
# Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Hardening vs. the dev compose:
#   - Jenkins is moved to a "dev-only" profile so it does NOT start in prod.
#   - All secrets come from .env (env_file:), not hard-coded.
#   - Adds Caddy as the single public ingress (TLS via Let's Encrypt).
#   - The OS firewall (UFW) is the actual enforcement layer that blocks
#     external traffic to 5432, 6379, 8080. Docker Compose's "ports:" from
#     the base file still publishes them to the host, but UFW drops external
#     packets so they're only reachable from inside the droplet.

services:
  db:
    env_file: .env
    environment:
      POSTGRES_DB: sportsapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sportsapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    env_file: .env
    # Optional: lock down redis with a password. The app would then need
    # spring.data.redis.password set, which the current application.yml
    # doesn't read — so leave commented out until the backend supports it.
    # command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    env_file: .env
    environment:
      # DB connection (matches new application.yml var names)
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sportsapp
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Mail
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # CORS — mobile apps don't enforce CORS so for the React Native app this
      # value barely matters. Set it to your future web frontend origin(s).
      # NEVER use "*" — the code will refuse to start.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://sportsmanapi.duckdns.org}
      # Google Sign-In client IDs (comma-separated). Leave empty until configured.
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  jenkins:
    # Put Jenkins behind a profile so `docker compose up` in prod skips it.
    # To start jenkins again locally: `docker compose --profile dev-only up jenkins`
    profiles: ["dev-only"]

  caddy:
    image: caddy:2-alpine
    container_name: sports-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: always

volumes:
  caddy_data:
  caddy_config:
